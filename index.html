<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ring of the Middle Earth</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap');

  :root {
    --gold:     #c9a84c;
    --gold-dim: #b49447;
    --dark:     #0d0b07;
    --dark2:    #161208;
    --dark3:    #1e1810;
    --parchment:#f1e8d2;
    --muted:    #d0c3aa;
    --muted2:   #b8aa90;
    --red:      #8b1a1a;
    --blue:     #1a3a5c;
    --green:    #1a3a1a;
    --shadow:   rgba(0,0,0,0.8);
    --light-side: #4a90d9;
    --dark-side:  #c0392b;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--dark);
    color: var(--parchment);
    font-family: 'IM Fell English', serif;
    font-size: 17px;
    font-weight: 500;
    line-height: 1.45;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(201,168,76,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(139,26,26,0.06) 0%, transparent 60%);
  }

  /* ── HEADER ─────────────────────────────────────────── */
  header {
    text-align: center;
    padding: 1.2rem 1rem 0.8rem;
    border-bottom: 1px solid var(--gold-dim);
    background: linear-gradient(180deg, rgba(201,168,76,0.08) 0%, transparent 100%);
    position: relative;
  }
  header::before {
    content: '⬥';
    position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
    color: var(--gold-dim); font-size: 1.2rem;
  }
  header::after {
    content: '⬥';
    position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
    color: var(--gold-dim); font-size: 1.2rem;
  }
  h1 {
    font-family: 'Cinzel Decorative', cursive;
    font-size: clamp(1rem, 3vw, 1.8rem);
    color: var(--gold);
    letter-spacing: 0.15em;
    text-shadow: 0 0 30px rgba(201,168,76,0.4);
  }
  .subtitle {
    font-size: 0.82rem;
    color: var(--gold-dim);
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 0.2rem;
  }

  /* ── LOGIN ──────────────────────────────────────────── */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    gap: 2rem;
    padding: 2rem;
  }
  .login-box {
    background: var(--dark2);
    border: 1px solid var(--gold-dim);
    padding: 2.5rem;
    max-width: 420px;
    width: 100%;
    position: relative;
  }
  .login-box::before {
    content: '';
    position: absolute; inset: 4px;
    border: 1px solid rgba(201,168,76,0.15);
    pointer-events: none;
  }
  .login-box h2 {
    font-family: 'Cinzel', serif;
    color: var(--gold);
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .form-group { margin-bottom: 1.2rem; }
  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 0.4rem;
  }
  input[type=text] {
    width: 100%;
    background: var(--dark3);
    border: 1px solid var(--gold-dim);
    color: var(--parchment);
    padding: 0.6rem 0.8rem;
    font-family: 'IM Fell English', serif;
    font-size: 1.05rem;
    font-weight: 600;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type=text]:focus { border-color: var(--gold); }

  .side-select {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem;
    margin-bottom: 1.2rem;
  }
  .side-btn {
    padding: 0.8rem;
    border: 1px solid var(--gold-dim);
    background: transparent;
    color: var(--parchment);
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .side-btn:hover { border-color: var(--gold); color: var(--gold); }
  .side-btn.active-light {
    background: rgba(74,144,217,0.2);
    border-color: var(--light-side);
    color: var(--light-side);
  }
  .side-btn.active-dark {
    background: rgba(192,57,43,0.2);
    border-color: var(--dark-side);
    color: var(--dark-side);
  }

  .btn {
    width: 100%;
    padding: 0.8rem;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn:hover {
    background: rgba(201,168,76,0.15);
    box-shadow: 0 0 20px rgba(201,168,76,0.2);
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #login-screen {
    font-weight: 400;
  }
  #login-screen label {
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    color: #7a6330;
  }
  #login-screen input[type=text] {
    color: #e8dfc8;
    font-size: 0.95rem;
    font-weight: 400;
  }
  #login-screen .side-btn {
    color: #e8dfc8;
    font-size: 0.75rem;
    font-weight: 400;
  }
  #login-screen .side-btn small {
    font-size: 0.78rem;
    font-weight: 400;
  }
  #login-screen .btn {
    font-size: 0.8rem;
    font-weight: 400;
  }

  /* ── MAIN GAME LAYOUT ───────────────────────────────── */
  #game-screen { display: none; }

  .game-layout {
    display: grid;
    grid-template-columns: 300px 1fr 310px;
    grid-template-rows: auto 1fr auto;
    gap: 0;
    min-height: calc(100vh - 90px);
  }

  /* ── STATUS BAR ─────────────────────────────────────── */
  .status-bar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 1.2rem;
    background: var(--dark2);
    border-bottom: 1px solid var(--gold-dim);
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.1em;
  }
  .turn-display {
    font-family: 'Cinzel', serif;
    color: var(--gold);
    font-size: 1.15rem;
    font-weight: 700;
  }
  .turn-timer {
    font-family: 'Cinzel', serif;
    color: var(--parchment);
    font-size: 0.86rem;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .turn-advance-btn {
    padding: 0.35rem 0.65rem;
    background: rgba(201,168,76,0.12);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
  }
  .turn-advance-btn:hover:not(:disabled) {
    border-color: var(--gold);
    background: rgba(201,168,76,0.22);
  }
  .turn-advance-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .turn-end-game-btn {
    border-color: rgba(192,57,43,0.75);
    color: #ff7675;
    background: rgba(192,57,43,0.1);
  }
  .turn-end-game-btn:hover:not(:disabled) {
    border-color: #ff7675;
    background: rgba(192,57,43,0.2);
  }
  .player-badge {
    padding: 0.3rem 0.8rem;
    border: 1px solid;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.15em;
  }
  .player-badge.light { border-color: var(--light-side); color: var(--light-side); }
  .player-badge.dark  { border-color: var(--dark-side);  color: var(--dark-side); }
  .connection-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #666; display: inline-block; margin-right: 6px;
    transition: background 0.3s;
  }
  .connection-dot.connected { background: #4caf50; box-shadow: 0 0 6px #4caf50; }

  /* ── LEFT PANEL — Units ─────────────────────────────── */
  .panel-left {
    background: var(--dark2);
    border-right: 1px solid rgba(201,168,76,0.2);
    padding: 0.65rem;
    overflow-y: auto;
    max-height: calc(100vh - 160px);
  }
  .panel-title {
    font-family: 'Cinzel', serif;
    font-size: 0.82rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    border-bottom: 1px solid rgba(201,168,76,0.2);
    padding-bottom: 0.4rem;
    margin-bottom: 0.55rem;
  }

  .unit-card {
    background: var(--dark3);
    border: 1px solid rgba(201,168,76,0.15);
    padding: 0.42rem 0.55rem;
    margin-bottom: 0.35rem;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .unit-card:hover { border-color: var(--gold-dim); }
  .unit-card.selected { border-color: var(--gold); background: rgba(201,168,76,0.08); }
  .unit-card.destroyed { opacity: 0.4; }
  .unit-card.respawning { opacity: 0.6; }

  .unit-name {
    font-family: 'Cinzel', serif;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 0.18rem;
    padding-right: 3.3rem;
  }
  .unit-meta {
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 600;
    display: flex;
    gap: 0.45rem;
    flex-wrap: wrap;
    min-height: 1rem;
  }
  .unit-meta span { color: var(--parchment); }
  .strength-bar {
    height: 3px;
    background: rgba(255,255,255,0.1);
    margin-top: 0.28rem;
    border-radius: 2px;
    overflow: hidden;
  }
  .strength-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    transition: width 0.5s;
  }
  .unit-region {
    font-size: 0.82rem;
    color: var(--parchment);
    font-weight: 700;
    margin-top: 0.22rem;
    font-style: italic;
  }
  .status-badge {
    position: absolute;
    top: 0.32rem; right: 0.42rem;
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    padding: 0.06rem 0.22rem;
    border: 1px solid;
  }
  .status-badge.active   { border-color: #4caf50; color: #4caf50; }
  .status-badge.destroyed{ border-color: var(--red); color: var(--red); }
  .status-badge.respawning{ border-color: #ff9800; color: #ff9800; }

  /* ── CENTER — Map ───────────────────────────────────── */
  .panel-center {
    position: relative;
    overflow: auto;
    background: var(--dark);
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  #map-canvas {
    width: 100%;
    height: auto;
    min-height: 0;
    display: block;
  }

  /* ── RIGHT PANEL — Orders + Events ─────────────────── */
  .panel-right {
    background: var(--dark2);
    border-left: 1px solid rgba(201,168,76,0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .order-panel {
    padding: 0.8rem;
    border-bottom: 1px solid rgba(201,168,76,0.2);
  }
  .order-type-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.4rem;
    margin: 0.6rem 0;
  }
  .order-btn {
    padding: 0.5rem;
    background: transparent;
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--muted);
    font-family: 'IM Fell English', serif;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .order-btn:hover:not(:disabled) {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.08);
  }
  .order-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .order-btn.active {
    border-color: var(--gold);
    background: rgba(201,168,76,0.15);
    color: var(--gold);
  }

  .order-detail {
    background: var(--dark3);
    border: 1px solid rgba(201,168,76,0.15);
    padding: 0.6rem;
    margin-top: 0.5rem;
    min-height: 60px;
    font-size: 0.95rem;
    color: var(--parchment);
    font-weight: 700;
    line-height: 1.45;
    font-style: italic;
  }

  .submit-btn {
    width: 100%;
    margin-top: 0.5rem;
    padding: 0.6rem;
    background: rgba(201,168,76,0.1);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .submit-btn:hover { background: rgba(201,168,76,0.2); }
  .submit-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── Event Log ──────────────────────────────────────── */
  .event-log {
    flex: 1;
    overflow-y: auto;
    padding: 0.8rem;
  }
  .event-entry {
    font-size: 0.82rem;
    padding: 0.35rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    line-height: 1.4;
    color: var(--muted);
    font-weight: 600;
    animation: fadeIn 0.3s ease;
  }
  .event-entry:first-child { color: var(--parchment); }
  .event-entry .ev-type {
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 0.1rem;
  }
  .event-entry.detection { color: var(--dark-side) !important; }
  .event-entry.detection .ev-type { color: var(--dark-side); }
  .event-entry.movement { color: #7ab8e8; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ── BOTTOM BAR ─────────────────────────────────────── */
  .bottom-bar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 1rem;
    min-height: 0;
    padding: 0.28rem 0.9rem;
    background: var(--dark2);
    border-top: 1px solid var(--gold-dim);
    font-size: 0.78rem;
    font-weight: 600;
  }
  .analysis-btn {
    padding: 0.25rem 0.62rem;
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .analysis-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
  }
  .risk-display {
    font-family: 'Cinzel', serif;
    color: var(--gold);
    font-size: 0.74rem;
    font-weight: 700;
  }

  /* ── GAME OVER OVERLAY ──────────────────────────────── */
  #gameover-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 2rem;
  }
  #gameover-overlay.show { display: flex; }
  .gameover-title {
    font-family: 'Cinzel Decorative', cursive;
    font-size: clamp(2rem, 6vw, 4rem);
    color: var(--gold);
    text-shadow: 0 0 60px rgba(201,168,76,0.6);
    text-align: center;
    animation: pulseGold 2s ease-in-out infinite;
  }
  @keyframes pulseGold {
    0%, 100% { text-shadow: 0 0 40px rgba(201,168,76,0.4); }
    50%       { text-shadow: 0 0 80px rgba(201,168,76,0.8); }
  }

  /* ── NOTIFICATION ───────────────────────────────────── */
  #notification {
    position: fixed;
    top: 1.2rem; right: 1.2rem;
    background: var(--dark2);
    border: 1px solid var(--gold);
    padding: 0.8rem 1.2rem;
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--gold);
    z-index: 50;
    transform: translateX(calc(100% + 2rem));
    transition: transform 0.3s ease;
    max-width: 300px;
  }
  #notification.show { transform: translateX(0); }
  #notification.error { border-color: var(--red); color: #e88; }

  /* ── SCROLLBAR ──────────────────────────────────────── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--dark); }
  ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

  #conn-status,
  #selected-unit-name,
  .order-detail label,
  .order-detail input,
  .order-detail select {
    font-size: 0.9rem !important;
    font-weight: 700 !important;
  }

  #selected-unit-name {
    color: var(--parchment) !important;
    font-size: 1rem !important;
    line-height: 1.35 !important;
  }

  .order-detail label {
    color: var(--gold) !important;
    letter-spacing: 0.12em !important;
  }

  .order-detail input,
  .order-detail select {
    color: var(--parchment) !important;
    padding: 6px 8px !important;
  }

  .side-btn small {
    font-size: 0.84rem;
    font-weight: 600;
    line-height: 1.3;
  }

  @media (max-width: 1100px) {
    .game-layout {
      grid-template-columns: 280px 1fr 290px;
    }
  }
</style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────── -->
<header>
  <h1>Ring of the Middle Earth</h1>
  <div class="subtitle">Distributed Strategy — The One Ring</div>
</header>

<!-- ── LOGIN SCREEN ────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <h2>⬥ Choose Your Fate ⬥</h2>

    <div class="form-group">
      <label>Player Name</label>
      <input type="text" id="player-id-input" placeholder="Enter your name..." />
    </div>

    <div class="form-group">
      <label>Choose Side</label>
      <div class="side-select">
        <button class="side-btn" id="btn-light" onclick="selectSide('FREE_PEOPLES')">
          🌟 Free Peoples<br><small style="opacity:0.7">Bear the Ring to Doom</small>
        </button>
        <button class="side-btn" id="btn-dark" onclick="selectSide('SHADOW')">
          🔥 The Shadow<br><small style="opacity:0.7">Find the Ring Bearer</small>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label>Game Server</label>
      <input type="text" id="server-url" value="http://localhost:80" />
    </div>

    <button class="btn" id="join-btn" onclick="joinGame()" disabled>
      Enter Middle Earth
    </button>
  </div>
</div>

<!-- ── GAME SCREEN ──────────────────────────────────────── -->
<div id="game-screen">

  <!-- Status Bar -->
  <div class="status-bar">
    <div>
      <span class="connection-dot" id="conn-dot"></span>
      <span id="conn-status" style="font-size:0.7rem;color:#666">Disconnected</span>
    </div>
    <div class="turn-display">Turn <span id="turn-number">—</span></div>
    <div class="turn-timer">Next turn in <span id="next-turn-countdown">waiting</span></div>
    <button class="turn-advance-btn" id="advance-turn-btn" onclick="advanceTurn()">End Turn</button>
    <button class="turn-advance-btn turn-end-game-btn" id="end-game-btn" onclick="endGame()">End Game</button>
    <div id="player-badge-container"></div>
  </div>

  <!-- Main Grid -->
  <div class="game-layout">

    <!-- LEFT: Unit List -->
    <div class="panel-left">
      <div class="panel-title">⬥ Your Units</div>
      <div id="unit-list"></div>
    </div>

    <!-- CENTER: Map Canvas -->
    <div class="panel-center">
      <canvas id="map-canvas"></canvas>
    </div>

    <!-- RIGHT: Orders + Event Log -->
    <div class="panel-right">
      <!-- Order Panel -->
      <div class="order-panel">
        <div class="panel-title">⬥ Give Order</div>
        <div id="selected-unit-name" style="font-size:0.75rem;color:#aaa;margin-bottom:0.5rem;font-style:italic">
          Select a unit first
        </div>
        <div class="order-type-grid" id="order-buttons"></div>
        <div class="order-detail" id="order-detail">
          Select a unit and choose an order type.
        </div>
        <button class="submit-btn" id="submit-order-btn" disabled onclick="submitOrder()">
          ⬥ Issue Order
        </button>
      </div>

      <!-- Event Log -->
      <div class="panel-title" style="padding:0.5rem 0.8rem;border-bottom:1px solid rgba(201,168,76,0.2)">
        ⬥ Chronicle of Events
      </div>
      <div class="event-log" id="event-log"></div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <button class="analysis-btn" onclick="fetchAnalysis()">
        ⬥ Analyse Routes
      </button>
      <div class="risk-display" id="risk-display"></div>
    </div>

  </div>
</div>

<!-- Game Over Overlay -->
<div id="gameover-overlay">
  <div class="gameover-title" id="gameover-title">Victory</div>
  <div style="font-family:'Cinzel',serif;color:#888;font-size:0.9rem;letter-spacing:0.2em"
       id="gameover-cause"></div>
  <button class="btn" style="max-width:200px" onclick="location.reload()">
    Play Again
  </button>
</div>

<!-- Notification -->
<div id="notification"></div>

<script>

}

// ══════════════════════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════════════════════
let chosenSide = '';

function selectSide(side) {
  chosenSide = side;
  document.getElementById('btn-light').className =
    'side-btn' + (side==='FREE_PEOPLES' ? ' active-light' : '');
  document.getElementById('btn-dark').className =
    'side-btn' + (side==='SHADOW' ? ' active-dark' : '');
  checkLoginReady();
}

document.getElementById('player-id-input')
  .addEventListener('input', checkLoginReady);

function checkLoginReady() {
  const name = document.getElementById('player-id-input').value.trim();
  document.getElementById('join-btn').disabled = !(name && chosenSide);
}

async function joinGame() {
  const playerId  = document.getElementById('player-id-input').value.trim();
  const serverURL = document.getElementById('server-url').value.trim();

  State.playerId  = playerId;
  State.side      = chosenSide;
  State.serverURL = serverURL;

  // Oyunu başlat (veya mevcut oyuna katıl)
  try {
    await fetch(`${serverURL}/game/start`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        mode: 'HVH',
        lightPlayerId: chosenSide === 'FREE_PEOPLES' ? playerId : 'dark-opponent',
        darkPlayerId:  chosenSide === 'SHADOW'       ? playerId : 'light-opponent',
      }),
    });
    State.lastSeenTurn = null;
    State.nextTurnAt = null;
    stopProcessingPoll();
  } catch(e) {
    // Oyun zaten başlamış olabilir — devam et
  }

  // Ekranları değiştir
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('game-screen').style.display  = 'block';

  // Player badge
  const badge = document.getElementById('player-badge-container');
  badge.innerHTML = `<div class="player-badge ${chosenSide==='FREE_PEOPLES'?'light':'dark'}">
    ${chosenSide==='FREE_PEOPLES'?'🌟 Free Peoples':'🔥 The Shadow'} — ${playerId}
  </div>`;

  // SSE bağlantısı
  connectSSE();

  // İlk durum
  await fetchState();
  initCanvas();
}

// ══════════════════════════════════════════════════════════
// SSE
// ══════════════════════════════════════════════════════════
function connectSSE() {
  const url = `${State.serverURL}/events?playerId=${encodeURIComponent(State.playerId)}&side=${encodeURIComponent(State.side)}`;
  State.sse = new EventSource(url);

  State.sse.onopen = () => {
    document.getElementById('conn-dot').className = 'connection-dot connected';
    document.getElementById('conn-status').textContent = 'Connected';
    document.getElementById('conn-status').style.color = '#4caf50';
  };

  State.sse.onerror = () => {
    document.getElementById('conn-dot').className = 'connection-dot';
    document.getElementById('conn-status').textContent = 'Reconnecting...';
    document.getElementById('conn-status').style.color = '#ff9800';
  };

  // Event handler'ları
  const eventPayload = e => {
    const parsed = JSON.parse(e.data);
    return parsed?.data || parsed;
  };

  State.sse.addEventListener('game.broadcast', e => {
    const data = eventPayload(e);
    handleWorldState(data);
  });

  State.sse.addEventListener('game.ring.position', e => {
    const data = eventPayload(e);
    const region = data.trueRegion || data.region || data.regionId;
    // Sadece Light Side alır
    logEvent('RingBearerMoved', `Frodo is at ${formatRegionName(region)}`, 'movement');
    notify(`Frodo moved to ${formatRegionName(region)}`);
  });

  State.sse.addEventListener('game.ring.detection', e => {
    const data = eventPayload(e);
    const location = data.regionId ? formatRegionName(data.regionId) : (data.pathId || 'unknown location');
    logEvent('RingBearerDetected', `Ring Bearer detected! ${location}`, 'detection');
    notify(`🔥 Ring Bearer detected!`, 'error');
  });

  State.sse.addEventListener('game.events.unit', e => {
    const data = eventPayload(e);
    logUnitEvent(data);
    fetchState(); // Durumu güncelle
  });

  State.sse.addEventListener('game.events.path', e => {
    const data = eventPayload(e);
    const status = data.newStatus || data.status || 'updated';
    logEvent('PathChanged', `${data.pathId || 'Unknown path'} -> ${status}`, '');
    fetchState();
  });

  State.sse.addEventListener('game.events.region', e => {
    const data = eventPayload(e);
    if (data.eventType === 'BATTLE_RESOLVED') {
      logEvent('BattleResolved', formatCombatLog(data), data.attackerWon ? 'movement' : 'detection');
    } else {
      logEvent('RegionEvent',
        `${formatRegionName(data.regionId)}: ${data.newController || 'updated'}`, '');
    }
    fetchState();
  });
}

// ══════════════════════════════════════════════════════════
function formatCombatLog(data) {
  const result = data.attackerWon ? `${data.attackerSide} wins` : `${data.defenderSide} holds`;
  const destroyed = (data.destroyed || []).map(formatUnitName);
  const respawning = (data.respawning || []).map(formatUnitName);
  const survivors = (data.survivors || []).map(formatUnitName);
  const losses = [
    destroyed.length ? `destroyed: ${destroyed.join(', ')}` : '',
    respawning.length ? `respawning: ${respawning.join(', ')}` : '',
  ].filter(Boolean).join('; ');
  const alive = survivors.length ? `survivors: ${survivors.join(', ')}` : 'no active survivors';
  const damage = data.damage ? `damage ${data.damage}` : 'attackers repelled, each attacker -1';
  return `${formatRegionName(data.regionId)}: ${result} (${data.attackerPower}-${data.defenderPower}, ${damage}). ${losses || alive}`;
}

// STATE FETCH
// ══════════════════════════════════════════════════════════
function logUnitEvent(data) {
  const unitName = formatUnitName(data.unitId);
  const eventType = data.eventType || data.event || (data.from && data.to ? 'MOVED' : 'UnitEvent');

  if (data.type === 'TRAVEL_STARTED') {
    const remaining = data.travelRemaining || 1;
    logEvent('UnitTravelling',
      `${unitName} travelling from ${formatRegionName(data.from)} to ${formatRegionName(data.to)} (${remaining} turn left)`,
      'movement');
    return;
  }

  if (data.from && data.to) {
    logEvent('UnitMoved',
      `${unitName} moved from ${formatRegionName(data.from)} to ${formatRegionName(data.to)}`, 'movement');
    return;
  }

  if (data.region) {
    logEvent(eventType, `${unitName} is at ${formatRegionName(data.region)}`, '');
    return;
  }

  logEvent(eventType, unitName, '');
}

async function fetchState() {
  try {
    const res = await fetch(
      `${State.serverURL}/game/state?playerId=${encodeURIComponent(State.playerId)}&side=${encodeURIComponent(State.side)}`
    );
    const data = await res.json();
    handleWorldState(data);
    return data;
  } catch(e) {
    console.error('State fetch failed:', e);
    return null;
  }
}

function refreshSelectedUnitFromState() {
  if (!State.selectedUnit || !State.units) return;
  const latest = State.units.find(u => u.id === State.selectedUnit.id);
  if (latest) State.selectedUnit = latest;
}

function handleWorldState(data) {
  if (data.turnDurationSeconds) State.turnDuration = data.turnDurationSeconds;
  if (data.maxTurns) State.maxTurns = data.maxTurns;

  if (data.turn !== undefined && data.turn !== null) {
    const previousTurn = State.lastSeenTurn;
    const turnChanged = previousTurn === null || data.turn !== previousTurn;

    if (previousTurn !== null && data.turn !== previousTurn) {
      logEvent('TurnProcessed', `Turn ${State.lastSeenTurn} resolved. Now playing turn ${data.turn}.`, '');
    }
    State.currentTurn = data.turn;
    State.lastSeenTurn = data.turn;
    document.getElementById('turn-number').textContent = data.turn;
    if (turnChanged) {
      stopProcessingPoll();
      startTurnCountdown();
    }
  }

  if (data.units) {
    State.units = data.units;
    refreshSelectedUnitFromState();
  }
  if (data.regions) {
    State.regions = {};
    data.regions.forEach(r => State.regions[r.id] = r);
  }
  if (data.paths) {
    State.paths = {};
    data.paths.forEach(p => State.paths[p.id] = p);
  }

  if (data.winner || (data.type === 'GameOver')) {
    showGameOver(data.winner, data.cause);
    return;
  }

  renderUnits();
  renderMap();
}

function startTurnCountdown() {
  State.nextTurnAt = Date.now() + State.turnDuration * 1000;
  if (!State.countdownId) {
    State.countdownId = setInterval(updateTurnCountdown, 1000);
  }
  updateTurnCountdown();
}

function updateTurnCountdown() {
  const el = document.getElementById('next-turn-countdown');
  if (!el) return;
  if (!State.nextTurnAt) {
    el.textContent = 'waiting';
    return;
  }
  const remaining = Math.max(0, Math.ceil((State.nextTurnAt - Date.now()) / 1000));
  el.textContent = `${remaining}s`;
  if (remaining === 0) {
    el.textContent = 'processing...';
    startProcessingPoll();
  }
}

function startProcessingPoll() {
  if (State.processingPollId) return;
  State.processingPollId = setInterval(fetchState, 2000);
}

function stopProcessingPoll() {
  if (!State.processingPollId) return;
  clearInterval(State.processingPollId);
  State.processingPollId = null;
}

async function advanceTurn() {
  const btn = document.getElementById('advance-turn-btn');
  if (btn) btn.disabled = true;
  try {
    if (State.selectedUnit && State.selectedOrder) {
      notify('Submitting selected order before ending turn...');
      const submitted = await submitOrder();
      if (!submitted) return;
    }

    const res = await fetch(`${State.serverURL}/game/advance-turn`, {method: 'POST'});
    if (!res.ok) {
      notify('Could not advance turn', 'error');
      return;
    }
    document.getElementById('next-turn-countdown').textContent = 'processing...';
    logEvent('ManualTurnAdvance', `Resolving turn ${State.currentTurn}.`, '');
    startProcessingPoll();
    await fetchState();
  } catch(e) {
    notify('Server unreachable', 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ══════════════════════════════════════════════════════════
async function endGame() {
  if (!confirm('End this game and reset to Turn 1?')) return;

  const btn = document.getElementById('end-game-btn');
  if (btn) btn.disabled = true;

  try {
    const res = await fetch(`${State.serverURL}/game/start`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        mode: 'HVH',
        lightPlayerId: State.side === 'FREE_PEOPLES' ? State.playerId : 'light-opponent',
        darkPlayerId:  State.side === 'SHADOW'       ? State.playerId : 'dark-opponent',
      }),
    });
    if (!res.ok) {
      notify('Could not reset game', 'error');
      return;
    }

    State.selectedUnit = null;
    State.selectedOrder = null;
    State.orderPayload = {};
    State.routeTargetRegion = null;
    State.selectedPathId = null;
    State.lastSeenTurn = null;
    State.nextTurnAt = null;
    stopProcessingPoll();

    document.getElementById('selected-unit-name').textContent = 'Select a unit first';
    document.getElementById('order-buttons').innerHTML = '';
    document.getElementById('order-detail').textContent = 'Select a unit and choose an order type.';
    document.getElementById('submit-order-btn').disabled = true;
    document.getElementById('risk-display').textContent = '';
    document.getElementById('event-log').innerHTML = '';
    document.getElementById('next-turn-countdown').textContent = 'waiting';

    logEvent('GameReset', 'Game ended and reset to Turn 1.', '');
    notify('Game reset to Turn 1');
    await fetchState();
  } catch(e) {
    notify('Server unreachable', 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

// UNIT LIST
// ══════════════════════════════════════════════════════════
function renderUnits() {
  const container = document.getElementById('unit-list');
  const mySide = State.side;
  const unitOrder = SIDE_UNIT_ORDER[mySide] || [];

  const myUnits = State.units.filter(u => {
    // Side bilgisi config'den geliyor — basit heuristic
    return unitOrder.includes(u.id);
  }).sort((a, b) => unitOrder.indexOf(a.id) - unitOrder.indexOf(b.id));

  container.innerHTML = myUnits.map(unit => {
    const maxStr = getMaxStrength(unit.id);
    const pct    = maxStr ? (unit.strength / maxStr) * 100 : 0;
    const status = (unit.status || 'ACTIVE').toLowerCase();
    const region = unit.currentRegion || unit.region || '—';
    const isSelected = State.selectedUnit?.id === unit.id;

    return `
    <div class="unit-card ${status} ${isSelected?'selected':''}"
         onclick="selectUnit('${unit.id}')">
      <div class="status-badge ${status}">${unit.status||'ACTIVE'}</div>
      <div class="unit-name">${formatUnitName(unit.id)}</div>
      <div class="unit-meta">
        <span>STR ${unit.strength||'?'}</span>
        ${unit.cooldown > 0 ? `<span>CD ${unit.cooldown}</span>` : ''}
        ${unit.respawnTurns > 0 ? `<span>Respawn ${unit.respawnTurns}</span>` : ''}
      </div>
      <div class="strength-bar">
        <div class="strength-fill" style="width:${pct}%"></div>
      </div>
      <div class="unit-region">${region === '' ? '(hidden)' : region}</div>
    </div>`;
  }).join('');
}

function formatUnitName(id) {
  const names = {
    'ring-bearer':'Frodo Baggins','aragorn':'Aragorn',
    'legolas':'Legolas','gimli':'Gimli','rohan-cavalry':'Riders of Rohan',
    'gondor-army':'Army of Gondor','gandalf':'Gandalf',
    'witch-king':'Witch-King','nazgul-2':'The Dark Marshal',
    'nazgul-3':'The Betrayer','uruk-hai-legion':'Uruk-hai Legion',
    'saruman':'Saruman','sauron':'Sauron',
  };
  return names[id] || id;
}

function getMaxStrength(id) {
  const str = {
    'ring-bearer':1,'aragorn':5,'legolas':3,'gimli':3,
    'rohan-cavalry':4,'gondor-army':5,'gandalf':4,
    'witch-king':5,'nazgul-2':3,'nazgul-3':3,
    'uruk-hai-legion':5,'saruman':4,'sauron':5,
  };
  return str[id] || 5;
}

function selectUnit(unitId) {
  const unit = State.units.find(u => u.id === unitId);
  if (!unit) return;

  State.selectedUnit  = unit;
  State.selectedOrder = null;
  State.orderPayload  = {};
  State.routeTargetRegion = null;
  State.selectedPathId = null;

  document.getElementById('selected-unit-name').textContent =
    formatUnitName(unitId);

  renderUnits();
  renderMap();
  renderOrderButtons(unitId);
  document.getElementById('order-detail').textContent =
    'Choose an order type above.';
  document.getElementById('submit-order-btn').disabled = true;
}

// ══════════════════════════════════════════════════════════
// ORDER PANEL
// ══════════════════════════════════════════════════════════
const ORDER_TYPES = [
  {id:'ASSIGN_ROUTE',   label:'Assign Route'},
  {id:'REDIRECT_UNIT',  label:'Redirect'},
  {id:'ATTACK_REGION',  label:'Attack'},
  {id:'BLOCK_PATH',     label:'Block Path'},
  {id:'SEARCH_PATH',    label:'Search Path'},
  {id:'MAIA_ABILITY',   label:'Maia Ability'},
  {id:'FORTIFY_REGION', label:'Fortify'},
  {id:'DESTROY_RING',   label:'Destroy Ring'},
];

async function renderOrderButtons(unitId) {
  const container = document.getElementById('order-buttons');

  let available = [];
  try {
    const res = await fetch(
      `${State.serverURL}/orders/available?unitId=${encodeURIComponent(unitId)}&playerId=${encodeURIComponent(State.playerId)}&side=${encodeURIComponent(State.side)}`
    );
    if (!res.ok) throw new Error(`orders endpoint returned ${res.status}`);
    const data = await res.json();
    available = data.availableOrders || [];
  } catch(e) {
    available = fallbackAvailableOrders(unitId);
  }

  container.innerHTML = ORDER_TYPES.map(o => `
    <button class="order-btn ${State.selectedOrder===o.id?'active':''}"
            ${available.includes(o.id)?'':'disabled'}
            onclick="selectOrder('${o.id}')">
      ${o.label}
    </button>
  `).join('');
}

function selectOrder(orderType) {
  State.selectedOrder = orderType;
  State.orderPayload  = {};
  State.routeTargetRegion = null;
  State.selectedPathId = null;

  const detail = document.getElementById('order-detail');

  switch(orderType) {
    case 'ASSIGN_ROUTE':
    case 'REDIRECT_UNIT':
      detail.innerHTML = `
        <label style="display:block;margin-bottom:4px;font-size:0.6rem;
                       letter-spacing:0.1em;color:var(--gold-dim)">
          PATH IDs
        </label>
        <input type="text" id="path-ids-input" placeholder="Click a map region or type path IDs"
               style="width:100%;background:var(--dark);border:1px solid #444;
                      color:var(--parchment);padding:4px 6px;font-size:0.7rem;outline:none"
               oninput="State.orderPayload.pathIds=this.value.split(',').map(s=>s.trim())"/>`;
      break;

    case 'ATTACK_REGION':
    case 'REINFORCE_REGION':
      detail.innerHTML = `
        <label style="display:block;margin-bottom:4px;font-size:0.6rem;
                       letter-spacing:0.1em;color:var(--gold-dim)">TARGET REGION</label>
        <select id="region-select"
                style="width:100%;background:var(--dark);border:1px solid #444;
                       color:var(--parchment);padding:4px;font-size:0.7rem"
                onchange="State.orderPayload.targetRegion=this.value">
          <option value="">Select region...</option>
          ${Object.keys(REGION_POS).map(r =>
            `<option value="${r}">${r}</option>`).join('')}
        </select>`;
      break;

    case 'BLOCK_PATH':
    case 'SEARCH_PATH':
      detail.innerHTML = `
        <label style="display:block;margin-bottom:4px;font-size:0.6rem;
                       letter-spacing:0.1em;color:var(--gold-dim)">PATH ID</label>
        <input type="text" id="path-id-input" placeholder="lothlorien-to-emyn-muil"
               style="width:100%;background:var(--dark);border:1px solid #444;
                      color:var(--parchment);padding:4px 6px;font-size:0.7rem;outline:none"
               oninput="State.orderPayload.pathId=this.value;State.selectedPathId=this.value;renderMap()"/>`;
      break;

    case 'MAIA_ABILITY':
      detail.innerHTML = `
        <label style="display:block;margin-bottom:4px;font-size:0.6rem;
                       letter-spacing:0.1em;color:var(--gold-dim)">TARGET PATH</label>
        <input type="text" id="maia-path-input" placeholder="rivendell-to-moria"
               style="width:100%;background:var(--dark);border:1px solid #444;
                      color:var(--parchment);padding:4px 6px;font-size:0.7rem;outline:none"
               oninput="State.orderPayload.targetPathId=this.value;State.selectedPathId=this.value;renderMap()"/>`;
      break;

    case 'FORTIFY_REGION':
      detail.textContent = 'Fortify current region (+2 defence for 2 turns).';
      State.orderPayload = {};
      break;

    case 'DESTROY_RING':
      detail.innerHTML = `
        <span style="color:#4caf50;font-size:0.75rem">
          ⬥ The Ring shall be unmade.<br>
          Submit only when at Mount Doom with no Shadow units present.
        </span>`;
      State.orderPayload = {};
      break;

    default:
      detail.textContent = orderType;
  }

  document.getElementById('submit-order-btn').disabled = false;
  renderMap();

  // Order button'larını güncelle
  document.querySelectorAll('.order-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.textContent.trim() ===
        ORDER_TYPES.find(o=>o.id===orderType)?.label) {
      btn.classList.add('active');
    }
  });
}

async function submitOrder() {
  if (!State.selectedUnit || !State.selectedOrder) return false;

  await fetchState();
  refreshSelectedUnitFromState();

  if ((State.selectedOrder === 'ASSIGN_ROUTE' || State.selectedOrder === 'REDIRECT_UNIT') && State.routeTargetRegion) {
    const currentRegion = State.selectedUnit.currentRegion || State.selectedUnit.region;
    const pathIds = shortestRoutePathIds(currentRegion, State.routeTargetRegion);
    if (pathIds.length === 0) {
      notify('No route found from current unit position', 'error');
      return false;
    }
    State.orderPayload.pathIds = pathIds;
    const input = document.getElementById('path-ids-input');
    if (input) input.value = pathIds.join(',');
  }

  if ((State.selectedOrder === 'BLOCK_PATH' || State.selectedOrder === 'SEARCH_PATH') && !State.orderPayload.pathId) {
    notify('Click a path on the map first', 'error');
    return false;
  }
  if (State.selectedOrder === 'MAIA_ABILITY' && !State.orderPayload.targetPathId) {
    notify('Click a target path on the map first', 'error');
    return false;
  }

  const body = {
    orderType: State.selectedOrder,
    playerId:  State.playerId,
    playerSide: State.side,
    unitId:    State.selectedUnit.id,
    turn:      State.currentTurn,
    payload:   State.orderPayload,
  };

  try {
    const res = await fetch(`${State.serverURL}/order`, {
      method:  'POST',
      headers: {'Content-Type':'application/json'},
      body:    JSON.stringify(body),
    });

    if (res.status === 202) {
      notify(`Order sent: ${State.selectedOrder}`);
      logEvent('OrderSubmitted',
        `${formatUnitName(State.selectedUnit.id)}: ${State.selectedOrder}`, '');
      State.selectedOrder = null;
      State.routeTargetRegion = null;
      State.selectedPathId = null;
      document.getElementById('submit-order-btn').disabled = true;
      renderMap();
      return true;
    } else {
      const err = await res.json();
      notify(err.message || 'Order rejected', 'error');
      if (err.code === 'WRONG_TURN' || /current turn/i.test(err.message || '')) {
        fetchState();
      }
      return false;
    }
  } catch(e) {
    notify('Server unreachable', 'error');
    return false;
  }
}

// ══════════════════════════════════════════════════════════
// CANVAS MAP
// ══════════════════════════════════════════════════════════
let canvas, ctx;
const MAP_Y_OFFSET_RATIO = -0.015;
const MAP_Y_SCALE = 1.14;
const MAP_Y_CENTER_RATIO = 0.43;
const LEGEND_BOX_H = 126;
const MIN_MAP_LEGEND_GAP = 16;

function initCanvas() {
  canvas = document.getElementById('map-canvas');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  renderMap();
}

function resizeCanvas() {
  const parent = canvas.parentElement;
  const width = Math.max(720, parent.clientWidth);
  const fittedHeight = fitCanvasHeightToMapLegend(width, Math.round(width * 0.68));
  const height = Math.max(fittedHeight, parent.clientHeight);
  canvas.width  = width;
  canvas.height = height;
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  renderMap();
}

function renderMap() {
  if (!canvas) return;
  ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Background
  ctx.fillStyle = '#f8f5eb';
  ctx.fillRect(0, 0, W, H);

  // Paths
  PATHS_DATA.forEach(([a, b]) => {
    const posA = REGION_POS[a], posB = REGION_POS[b];
    if (!posA || !posB) return;

    const [ax, ay] = mapPoint(a, W, H);
    const [bx, by] = mapPoint(b, W, H);

    // Find path status
    const pathId = findPathId(a, b);
    const pathState = pathId ? State.paths[pathId] : null;
    const pathSelected = State.selectedPathId === pathId;

    const cost = pathCost(a, b);
    let lineColor = cost === 2 ? '#555' : '#888';
    let lineWidth = cost === 2 ? 4 : 3;
    let lineDash = cost === 2 ? [8, 8] : [];
    let hiddenPath = false;
    if (pathState) {
      switch(pathState.status) {
        case 'BLOCKED':
          hiddenPath = true;
          break;
        case 'THREATENED':
          lineColor = '#ffdd59';
          lineWidth = 4;
          break;
        case 'TEMPORARILY_OPEN':
          lineColor = '#4b7bec';
          lineWidth = 4;
          lineDash = [];
          break;
      }
    }

    if (pathSelected && !hiddenPath) {
      ctx.beginPath();
      ctx.setLineDash([]);
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = lineWidth + 6;
      ctx.stroke();
    }

    if (hiddenPath) {
      drawBlockedPathMarker(ctx, (ax + bx) / 2, (ay + by) / 2, Math.atan2(by - ay, bx - ax));
    } else {
      ctx.beginPath();
      ctx.setLineDash(lineDash);
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.strokeStyle = lineColor;
      ctx.lineWidth   = lineWidth;
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Surveillance dots
    if (!hiddenPath && pathState && pathState.surveillanceLevel > 0) {
      const mx = (ax+bx)/2, my = (ay+by)/2;
      for (let i=0; i<pathState.surveillanceLevel; i++) {
        ctx.beginPath();
        ctx.arc(mx + i*6 - 3, my - 4, 2, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,152,0,0.8)';
        ctx.fill();
      }
    }
  });

  // Regions
  Object.entries(REGION_POS).forEach(([id, [px, py]]) => {
    const [x, y] = mapPoint(id, W, H);
    const regionState = State.regions[id];
    const ctrl = regionState?.controller || 'NEUTRAL';

    // Node background
    const radius = 18;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI*2);
    ctx.fillStyle = NODE_FILL[ctrl] || NODE_FILL.NEUTRAL;
    ctx.fill();

    // SVG-style node border
    const routeSelected = State.routeTargetRegion === id &&
      (State.selectedOrder === 'ASSIGN_ROUTE' || State.selectedOrder === 'REDIRECT_UNIT');
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI*2);
    ctx.strokeStyle = routeSelected ? '#111111' : '#ffffff';
    ctx.lineWidth   = routeSelected ? 5 : 3;
    ctx.stroke();
    if (routeSelected) {
      ctx.beginPath();
      ctx.arc(x, y, radius + 6, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(17,17,17,0.78)';
      ctx.lineWidth   = 2;
      ctx.setLineDash([5, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    drawTerrainIconOnNode(ctx, x, y, REGION_TERRAIN[id]);

    // Fortification indicator
    if (regionState?.fortified) {
      drawFortifyMarker(ctx, x, y, radius, regionState.fortifyTurns);
    }

    drawRegionLabel(ctx, formatRegionName(id), x, y, id);

    // Units in region
    const unitsHere = State.units.filter(u =>
      (u.currentRegion || u.region) === id
    );
    if (unitsHere.length > 0) {
      drawUnitBadges(ctx, x + radius + 6, y - radius - 8, unitsHere);
    }
  });

  // Ring Bearer special marker (Light Side only)
  if (State.side === 'FREE_PEOPLES') {
    const rb = State.units.find(u => u.id === 'ring-bearer');
    if (rb && rb.currentRegion && rb.currentRegion !== '') {
      const pos = REGION_POS[rb.currentRegion];
      if (pos) {
        const [x, y] = mapPoint(rb.currentRegion, W, H);
        // Glowing ring badge
        const bx = x - 17, by = y - 17;
        const gradient = ctx.createRadialGradient(bx, by, 0, bx, by, 18);
        gradient.addColorStop(0, 'rgba(201,168,76,0.4)');
        gradient.addColorStop(1, 'rgba(201,168,76,0)');
        ctx.beginPath();
        ctx.arc(bx, by, 18, 0, Math.PI*2);
        ctx.fillStyle = gradient;
        ctx.fill();

        drawRingBadge(ctx, bx, by);
      }
    }
  }

  drawMapLegend(ctx, W, H);
}

function mapPoint(regionId, W, H) {
  const pos = REGION_POS[regionId];
  if (!pos) return [0, 0];
  const rawY = pos[1] / 100;
  const scaledY = MAP_Y_CENTER_RATIO + (rawY - MAP_Y_CENTER_RATIO) * MAP_Y_SCALE;
  return [pos[0] / 100 * W, scaledY * H + H * MAP_Y_OFFSET_RATIO];
}

function mapVisualBounds(W, H) {
  let top = Infinity;
  let bottom = -Infinity;
  Object.keys(REGION_POS).forEach(id => {
    const [, y] = mapPoint(id, W, H);
    const [, labelDy] = LABEL_OFFSET[id] || [0, 34];
    top = Math.min(top, y - 18, y + labelDy - 13);
    bottom = Math.max(bottom, y + 18, y + labelDy + 13);
  });
  return { top, bottom };
}

function fitCanvasHeightToMapLegend(W, initialH) {
  let H = initialH;
  for (let i = 0; i < 6; i++) {
    const bounds = mapVisualBounds(W, H);
    const mapTopGap = Math.max(MIN_MAP_LEGEND_GAP, Math.round(bounds.top));
    H = Math.ceil(bounds.bottom + mapTopGap + LEGEND_BOX_H);
  }
  return H;
}

function findPathId(a, b) {
  const candidates = Object.keys(State.paths);
  for (const id of candidates) {
    const path = State.paths[id];
    if ((path.from === a && path.to === b) ||
        (path.from === b && path.to === a)) return id;
    if ((id.includes(a) && id.includes(b)) ||
        (id.includes(b) && id.includes(a))) return id;
  }
  const slug = region => region === 'the-shire' ? 'shire' : region;
  return `${slug(a)}-to-${slug(b)}`;
}

function selectedOrderUsesPathClick() {
  return ['BLOCK_PATH', 'SEARCH_PATH', 'MAIA_ABILITY'].includes(State.selectedOrder);
}

function setSelectedPath(pathId) {
  if (!pathId) return;
  State.selectedPathId = pathId;

  if (State.selectedOrder === 'MAIA_ABILITY') {
    State.orderPayload.targetPathId = pathId;
    const input = document.getElementById('maia-path-input');
    if (input) input.value = pathId;
  } else {
    State.orderPayload.pathId = pathId;
    const input = document.getElementById('path-id-input');
    if (input) input.value = pathId;
  }

  notify(`Path selected: ${pathId}`);
  renderMap();
}

function distanceToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax;
  const dy = by - ay;
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return Math.hypot(px - ax, py - ay);
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lenSq));
  const x = ax + t * dx;
  const y = ay + t * dy;
  return Math.hypot(px - x, py - y);
}

function findClickedPath(mx, my) {
  if (!canvas) return null;
  let closest = null;
  let minDist = Infinity;
  PATHS_DATA.forEach(([a, b]) => {
    const posA = REGION_POS[a], posB = REGION_POS[b];
    if (!posA || !posB) return;
    const [ax, ay] = mapPoint(a, canvas.width, canvas.height);
    const [bx, by] = mapPoint(b, canvas.width, canvas.height);
    const dist = distanceToSegment(mx, my, ax, ay, bx, by);
    if (dist < minDist && dist < 16) {
      minDist = dist;
      closest = findPathId(a, b);
    }
  });
  return closest;
}

function pathCost(a, b) {
  return PATH_COST[`${a}|${b}`] || PATH_COST[`${b}|${a}`] || 1;
}

function drawBlockedPathMarker(ctx, x, y, angle = 0, showLabel = true) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  roundedRect(ctx, -22, -9, 44, 18, 5);
  ctx.fillStyle = '#f8f5eb';
  ctx.fill();
  ctx.strokeStyle = '#eb3b5a';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-16, 0);
  ctx.lineTo(16, 0);
  ctx.strokeStyle = '#eb3b5a';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-10, -5);
  ctx.lineTo(-4, 5);
  ctx.moveTo(0, -5);
  ctx.lineTo(6, 5);
  ctx.moveTo(10, -5);
  ctx.lineTo(16, 5);
  ctx.strokeStyle = '#eb3b5a';
  ctx.lineWidth = 2;
  ctx.stroke();

  if (showLabel) {
    ctx.rotate(-angle);
    ctx.font = 'bold 10px Segoe UI, sans-serif';
    ctx.fillStyle = '#eb3b5a';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('BLOCKED', 0, -20);
  }
  ctx.restore();
}

function autoRouteStepCost(a, b, targetRegion, fromRegion) {
  let cost = pathCost(a, b);

  if (State.side === 'FREE_PEOPLES' &&
      targetRegion === 'mount-doom' &&
      fromRegion !== 'mordor' &&
      (a === 'mordor' || b === 'mordor')) {
    cost += 100;
  }

  return cost;
}

function shortestRoutePathIds(fromRegion, toRegion) {
  if (!fromRegion || !toRegion || fromRegion === toRegion) return [];

  const graph = {};
  PATHS_DATA.forEach(([a, b]) => {
    const pathId = findPathId(a, b) || `${a}-to-${b}`;
    const cost = autoRouteStepCost(a, b, toRegion, fromRegion);
    (graph[a] ||= []).push({to: b, pathId, cost});
    (graph[b] ||= []).push({to: a, pathId, cost});
  });

  const distances = {};
  const previous = {};
  const queue = new Set(Object.keys(REGION_POS));
  Object.keys(REGION_POS).forEach(id => { distances[id] = Infinity; });
  distances[fromRegion] = 0;

  while (queue.size > 0) {
    let current = null;
    queue.forEach(id => {
      if (current === null || distances[id] < distances[current]) current = id;
    });
    if (current === null || distances[current] === Infinity) break;

    queue.delete(current);
    if (current === toRegion) break;

    (graph[current] || []).forEach(edge => {
      if (!queue.has(edge.to)) return;
      const candidate = distances[current] + edge.cost;
      if (candidate < distances[edge.to]) {
        distances[edge.to] = candidate;
        previous[edge.to] = {region: current, pathId: edge.pathId};
      }
    });
  }

  if (!previous[toRegion]) return [];

  const pathIds = [];
  let cursor = toRegion;
  while (cursor !== fromRegion) {
    const step = previous[cursor];
    if (!step) return [];
    pathIds.unshift(step.pathId);
    cursor = step.region;
  }
  return pathIds;
}

function assignRouteToRegion(targetRegion) {
  if (!State.selectedUnit || !targetRegion) {
    notify('Select a unit first', 'error');
    return;
  }

  const currentRegion = State.selectedUnit.currentRegion || State.selectedUnit.region;
  const pathIds = shortestRoutePathIds(currentRegion, targetRegion);
  if (pathIds.length === 0) {
    notify('No route found', 'error');
    return;
  }

  const input = document.getElementById('path-ids-input');
  if (input) input.value = pathIds.join(',');
  State.routeTargetRegion = targetRegion;
  State.orderPayload.pathIds = pathIds;
  notify(`Route target: ${formatRegionName(targetRegion)}`);
  renderMap();
}

function roundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawRegionLabel(ctx, text, x, y, id) {
  const [dx, dy] = LABEL_OFFSET[id] || [0, 34];
  ctx.font = 'bold 13px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const width = Math.max(54, ctx.measureText(text).width + 18);
  const height = 26;
  const lx = x + dx;
  const ly = y + dy;

  roundedRect(ctx, lx - width/2, ly - height/2, width, height, 6);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = '#dcdde1';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#2c3e50';
  ctx.fillText(text, lx, ly + 1);
}

function drawTerrainIconOnNode(ctx, x, y, terrain) {
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = '#ffffff';
  ctx.fillStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  switch (terrain) {
    case 'SWAMP':
      ctx.beginPath();
      ctx.moveTo(x - 8, y - 2);
      ctx.quadraticCurveTo(x - 4, y - 5, x, y - 2);
      ctx.quadraticCurveTo(x + 4, y + 1, x + 8, y - 2);
      ctx.moveTo(x - 7, y + 4);
      ctx.quadraticCurveTo(x - 3, y + 1, x + 1, y + 4);
      ctx.quadraticCurveTo(x + 5, y + 7, x + 8, y + 4);
      ctx.stroke();
      break;
    case 'MOUNTAINS':
      ctx.beginPath();
      ctx.moveTo(x - 9, y + 6);
      ctx.lineTo(x - 3, y - 7);
      ctx.lineTo(x + 2, y + 2);
      ctx.moveTo(x - 2, y + 6);
      ctx.lineTo(x + 5, y - 8);
      ctx.lineTo(x + 10, y + 6);
      ctx.stroke();
      break;
    case 'FOREST':
      ctx.beginPath();
      ctx.moveTo(x, y - 9);
      ctx.lineTo(x - 7, y + 3);
      ctx.lineTo(x - 3, y + 3);
      ctx.lineTo(x - 8, y + 9);
      ctx.lineTo(x + 8, y + 9);
      ctx.lineTo(x + 3, y + 3);
      ctx.lineTo(x + 7, y + 3);
      ctx.closePath();
      ctx.fill();
      break;
    case 'FORTRESS':
      ctx.beginPath();
      ctx.moveTo(x - 8, y - 6);
      ctx.lineTo(x - 8, y + 8);
      ctx.lineTo(x + 8, y + 8);
      ctx.lineTo(x + 8, y - 6);
      ctx.lineTo(x + 4, y - 6);
      ctx.lineTo(x + 4, y - 2);
      ctx.lineTo(x - 4, y - 2);
      ctx.lineTo(x - 4, y - 6);
      ctx.closePath();
      ctx.fill();
      break;
    case 'VOLCANIC':
      ctx.beginPath();
      ctx.moveTo(x - 9, y + 8);
      ctx.lineTo(x - 3, y - 3);
      ctx.lineTo(x + 3, y - 3);
      ctx.lineTo(x + 9, y + 8);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - 2, y - 7);
      ctx.quadraticCurveTo(x, y - 12, x + 2, y - 7);
      ctx.strokeStyle = '#ffdd59';
      ctx.stroke();
      break;
    case 'PLAINS':
    default:
      ctx.beginPath();
      ctx.moveTo(x - 8, y + 5);
      ctx.lineTo(x + 8, y + 5);
      ctx.moveTo(x - 5, y + 5);
      ctx.lineTo(x - 7, y - 2);
      ctx.moveTo(x, y + 5);
      ctx.lineTo(x, y - 5);
      ctx.moveTo(x + 5, y + 5);
      ctx.lineTo(x + 7, y - 2);
      ctx.stroke();
      break;
  }

  ctx.restore();
}

function drawUnitBadges(ctx, x, y, units) {
  const visibleUnits = units
    .filter(u => (u.status || 'ACTIVE') !== 'DESTROYED')
    .slice()
    .sort((a, b) => unitSide(a.id).localeCompare(unitSide(b.id)) || unitInitials(a.id).localeCompare(unitInitials(b.id)));
  const maxBadges = 4;
  visibleUnits.slice(0, maxBadges).forEach((unit, idx) => {
    drawUnitBadge(ctx, x, y + idx * 22, unit);
  });
  if (visibleUnits.length > maxBadges) {
    drawOverflowBadge(ctx, x, y + maxBadges * 22, visibleUnits.length - maxBadges);
  }
}

function unitBadgeBounds(ctx, x, y, unit) {
  const side = unitSide(unit.id);
  const label = `${side === 'LIGHT' ? 'L' : 'S'} ${unitInitials(unit.id)}`;
  ctx.save();
  ctx.font = 'bold 10px Segoe UI, sans-serif';
  const width = Math.max(44, ctx.measureText(label).width + 16);
  ctx.restore();
  return { x, y, width, height: 18 };
}

function drawUnitBadge(ctx, x, y, unit) {
  const side = unitSide(unit.id);
  const selected = State.selectedUnit?.id === unit.id;
  const label = `${side === 'LIGHT' ? 'L' : 'S'} ${unitInitials(unit.id)}`;
  ctx.font = 'bold 10px Segoe UI, sans-serif';
  const { width } = unitBadgeBounds(ctx, x, y, unit);

  ctx.save();
  roundedRect(ctx, x, y, width, 18, 5);
  ctx.fillStyle = side === 'LIGHT' ? 'rgba(74,144,217,0.92)' : 'rgba(192,57,43,0.92)';
  ctx.fill();
  ctx.strokeStyle = selected ? '#111111' : '#ffffff';
  ctx.lineWidth = selected ? 3 : 1.5;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 10px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + width / 2, y + 9);
  ctx.restore();
}

function findClickedUnit(mx, my) {
  if (!canvas || !ctx) return null;
  const W = canvas.width, H = canvas.height;
  let hit = null;
  Object.entries(REGION_POS).some(([id]) => {
    const [x, y] = mapPoint(id, W, H);
    const unitsHere = State.units
      .filter(u => (u.currentRegion || u.region) === id)
      .filter(u => (u.status || 'ACTIVE') !== 'DESTROYED')
      .slice()
      .sort((a, b) => unitSide(a.id).localeCompare(unitSide(b.id)) || unitInitials(a.id).localeCompare(unitInitials(b.id)));
    const radius = 18;
    const maxBadges = 4;
    return unitsHere.slice(0, maxBadges).some((unit, idx) => {
      const b = unitBadgeBounds(ctx, x + radius + 6, y - radius - 8 + idx * 22, unit);
      if (mx >= b.x && mx <= b.x + b.width && my >= b.y && my <= b.y + b.height) {
        hit = unit;
        return true;
      }
      return false;
    });
  });
  return hit;
}

function drawOverflowBadge(ctx, x, y, count) {
  ctx.save();
  roundedRect(ctx, x, y, 36, 18, 5);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = '#2c3e50';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = '#2c3e50';
  ctx.font = 'bold 10px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`+${count}`, x + 18, y + 9);
  ctx.restore();
}

function unitSide(id) {
  if (['ring-bearer','aragorn','legolas','gimli','rohan-cavalry','gondor-army','gandalf'].includes(id)) {
    return 'LIGHT';
  }
  return 'SHADOW';
}

function unitInitials(id) {
  const map = {
    'ring-bearer': 'FR',
    'aragorn': 'AR',
    'legolas': 'LE',
    'gimli': 'GI',
    'rohan-cavalry': 'RO',
    'gondor-army': 'GO',
    'gandalf': 'GA',
    'witch-king': 'WK',
    'nazgul-2': 'N2',
    'nazgul-3': 'N3',
    'uruk-hai': 'UR',
    'saruman': 'SA',
    'sauron': 'SU',
    'orc-host': 'OH',
  };
  return map[id] || id.slice(0, 2).toUpperCase();
}

function drawRingBadge(ctx, x, y) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, 12, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = '#c9a84c';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#c9a84c';
  ctx.font = '16px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('💍', x, y + 1);
  ctx.restore();
}

function drawMapLegend(ctx, W, H) {
  const boxW = Math.min(220, W * 0.22);
  const boxH = LEGEND_BOX_H;
  const gap = 24;
  const totalW = boxW * 3 + gap * 2;
  const startX = Math.max(18, (W - totalW) / 2);
  const y = Math.round(H - boxH);

  drawLegendBox(ctx, startX, y, boxW, boxH, 'Start Control');
  drawLegendDot(ctx, startX + 26, y + 50, NODE_FILL.FREE_PEOPLES, 'Free Peoples');
  drawLegendDot(ctx, startX + 26, y + 75, NODE_FILL.SHADOW, 'Shadow');
  drawLegendDot(ctx, startX + 26, y + 100, NODE_FILL.NEUTRAL, 'Neutral');

  const pathX = startX + boxW + gap;
  drawLegendBox(ctx, pathX, y, boxW, boxH, 'Path Costs');
  drawLegendLine(ctx, pathX + 24, y + 50, false, 'Cost 1');
  drawLegendLine(ctx, pathX + 24, y + 72, true, 'Cost 2');
  drawLegendLine(ctx, pathX + 24, y + 94, false, 'Temp Open', '#4b7bec', 4);
  drawLegendBlocked(ctx, pathX + 44, y + 113, 'Blocked');

  const terrainX = pathX + boxW + gap;
  drawLegendBox(ctx, terrainX, y, boxW, boxH, 'Terrain Icons');
  const terrainItems = [['Plains', 50], ['Swamp', 50], ['Mountains', 75], ['Forest', 75], ['Fortress', 100], ['Volcanic', 100]];
  terrainItems.forEach(([label, rowY], idx) => {
    const colX = terrainX + (idx % 2 === 0 ? 24 : boxW / 2 + 12);
    drawTerrainIcon(ctx, colX, y + rowY, label);
  });
}

function drawLegendBox(ctx, x, y, w, h, title) {
  roundedRect(ctx, x, y, w, h, 8);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = '#dcdde1';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.font = 'bold 15px Segoe UI, sans-serif';
  ctx.fillStyle = '#2c3e50';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(title, x + 14, y + 26);
}

function drawLegendDot(ctx, x, y, color, label) {
  ctx.beginPath();
  ctx.arc(x, y, 8, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.font = '14px Segoe UI, sans-serif';
  ctx.fillStyle = '#576574';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + 20, y + 1);
}

function drawLegendLine(ctx, x, y, dashed, label, color, width) {
  ctx.beginPath();
  ctx.setLineDash(dashed ? [8, 8] : []);
  ctx.moveTo(x, y);
  ctx.lineTo(x + 42, y);
  ctx.strokeStyle = color || (dashed ? '#555' : '#888');
  ctx.lineWidth = width || (dashed ? 4 : 3);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.font = '14px Segoe UI, sans-serif';
  ctx.fillStyle = '#576574';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + 54, y + 1);
}

function drawFortifyMarker(ctx, x, y, radius, turns) {
  ctx.save();

  ctx.beginPath();
  ctx.arc(x, y, radius + 6, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(201,168,76,0.95)';
  ctx.lineWidth = 3;
  ctx.setLineDash([5, 3]);
  ctx.stroke();
  ctx.setLineDash([]);

  const bx = x;
  const by = y - radius - 18;
  ctx.beginPath();
  ctx.moveTo(bx, by - 13);
  ctx.lineTo(bx + 14, by - 7);
  ctx.lineTo(bx + 11, by + 10);
  ctx.quadraticCurveTo(bx, by + 18, bx - 11, by + 10);
  ctx.lineTo(bx - 14, by - 7);
  ctx.closePath();
  ctx.fillStyle = '#fff8dc';
  ctx.fill();
  ctx.strokeStyle = '#c9a84c';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#7a5c12';
  ctx.font = 'bold 9px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(turns ? `+${turns}` : '+', bx, by + 1);
  ctx.restore();
}

function drawLegendBlocked(ctx, x, y, label) {
  drawBlockedPathMarker(ctx, x, y, 0, false);
  ctx.font = '14px Segoe UI, sans-serif';
  ctx.fillStyle = '#576574';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + 34, y + 1);
}

function drawTerrainIcon(ctx, x, y, label) {
  ctx.beginPath();
  ctx.arc(x, y, 10, 0, Math.PI * 2);
  ctx.fillStyle = '#7f8fa6';
  ctx.fill();
  drawTerrainIconOnNode(ctx, x, y, label.toUpperCase());

  ctx.font = '13px Segoe UI, sans-serif';
  ctx.fillStyle = '#576574';
  ctx.textAlign = 'left';
  ctx.fillText(label, x + 16, y + 1);
}

function formatRegionName(id) {
  const map = {
    'the-shire':'The Shire','bree':'Bree','tharbad':'Tharbad',
    'weathertop':'Weathertop','rivendell':'Rivendell',
    'fangorn':'Fangorn','fords-of-isen':'Fords of Isen','rohan-plains':'Rohan Plains',
    'moria':'Moria','helms-deep':'Helm\'s Deep','isengard':'Isengard',
    'edoras':'Edoras','lothlorien':'Lothlórien','dead-marshes':'Dead Marshes',
    'emyn-muil':'Emyn Muil','minas-tirith':'Minas Tirith','ithilien':'Ithilien',
    'osgiliath':'Osgiliath','minas-morgul':'Minas Morgul',
    'cirith-ungol':'Cirith Ungol','mordor':'Mordor','mount-doom':'Mount Doom',
  };
  return map[id] || id;
}

// ══════════════════════════════════════════════════════════
// ANALYSIS
// ══════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════
// EVENT LOG
// ══════════════════════════════════════════════════════════
async function fetchAnalysis() {
  const endpoint = State.side === 'FREE_PEOPLES'
    ? '/analysis/routes'
    : '/analysis/intercept';
  const riskDisplay = document.getElementById('risk-display');
  riskDisplay.textContent = 'Analyzing...';

  try {
    const res = await fetch(`${State.serverURL}${endpoint}?playerId=${encodeURIComponent(State.playerId)}&side=${encodeURIComponent(State.side)}`);
    if (!res.ok) throw new Error(`analysis failed: ${res.status}`);
    const data = await res.json();

    if (State.side === 'FREE_PEOPLES' && data.routes) {
      const best = data.routes[0];
      riskDisplay.textContent = best
        ? `Best route: ${ROUTE_NAMES[best.routeId] || best.routeId} (risk ${best.riskScore})`
        : 'No route analysis available';
      logEvent('RouteAnalysis',
        `Recommended: ${ROUTE_NAMES[data.recommended] || data.recommended} - ${data.routes?.length} routes scored`, '');
    } else if (data.byUnit) {
      const best = data.byUnit[0];
      riskDisplay.textContent = best
        ? `Best intercept: ${formatUnitName(best.unitId)} -> ${formatRegionName(best.targetRegion)} (${best.score})`
        : 'No intercept plan available';
      logEvent('InterceptAnalysis',
        `${data.byUnit?.length} Nazgul interception plans computed`, '');
    } else {
      riskDisplay.textContent = 'No analysis available';
    }
  } catch(e) {
    riskDisplay.textContent = '';
    notify('Analysis unavailable', 'error');
  }
}

function logEvent(type, message, cssClass) {
  const log = document.getElementById('event-log');
  const entry = document.createElement('div');
  entry.className = `event-entry ${cssClass}`;
  entry.innerHTML = `<span class="ev-type">${type}</span>${message}`;
  log.insertBefore(entry, log.firstChild);

  // Max 100 entry
  while (log.children.length > 100) {
    log.removeChild(log.lastChild);
  }
}

// ══════════════════════════════════════════════════════════
// NOTIFICATION
// ══════════════════════════════════════════════════════════
let notifTimer;
function notify(msg, type='') {
  const el = document.getElementById('notification');
  el.textContent = msg;
  el.className   = `show ${type}`;
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => el.className = type, 3000);
}

// ══════════════════════════════════════════════════════════
// GAME OVER
// ══════════════════════════════════════════════════════════
function showGameOver(winner, cause) {
  const overlay = document.getElementById('gameover-overlay');
  const title   = document.getElementById('gameover-title');
  const causeEl = document.getElementById('gameover-cause');

  if (winner === 'FREE_PEOPLES') {
    title.textContent = '🌟 The Ring is Destroyed!';
    title.style.color = '#4a90d9';
  } else if (winner === 'SHADOW') {
    title.textContent = '🔥 Darkness Prevails';
    title.style.color = '#c0392b';
  } else {
    title.textContent = '⚖️ The Age Ends in Shadow';
    title.style.color = '#c9a84c';
  }

  causeEl.textContent = cause || '';
  overlay.classList.add('show');

  if (State.sse) State.sse.close();
}

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  // Canvas click — region seçimi
  document.getElementById('map-canvas')?.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);

    if (selectedOrderUsesPathClick()) {
      const pathId = findClickedPath(mx, my);
      if (pathId) {
        setSelectedPath(pathId);
      } else {
        notify('Click closer to a path line', 'error');
      }
      return;
    }

    // En yakın region'ı bul
    const clickedUnit = findClickedUnit(mx, my);
    if (clickedUnit) {
      selectUnit(clickedUnit.id);
      notify(`Selected: ${formatUnitName(clickedUnit.id)}`);
      return;
    }

    let closest = null, minDist = Infinity;
    Object.entries(REGION_POS).forEach(([id]) => {
      const [x, y] = mapPoint(id, canvas.width, canvas.height);
      const d = Math.hypot(mx-x, my-y);
      if (d < minDist && d < 25) { minDist = d; closest = id; }
    });

    if (closest) {
      // Seçili order için region set et
      if (State.selectedOrder === 'ASSIGN_ROUTE' || State.selectedOrder === 'REDIRECT_UNIT') {
        assignRouteToRegion(closest);
      } else {
        const regionSelect = document.getElementById('region-select');
        if (regionSelect) regionSelect.value = closest;
        State.orderPayload.targetRegion = closest;
        notify(`Selected: ${formatRegionName(closest)}`);
      }
    }
  });
});
