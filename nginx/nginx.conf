# ═══════════════════════════════════════════════════════
# Ring of the Middle Earth — Nginx Load Balancer
# Round-robin across 3 Go engine instances
# ═══════════════════════════════════════════════════════

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Upstream: 3 Go engine instances ──
    upstream game_engines {
        ip_hash;
        zone game_engines 64k;
        server go-engine-1:8080 resolve max_fails=1 fail_timeout=5s;
        server go-engine-2:8080 resolve max_fails=1 fail_timeout=5s;
        server go-engine-3:8080 resolve max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Game API endpoints ──
        location / {
            proxy_pass http://game_engines;
            proxy_http_version 1.1;

            # SSE support
            proxy_set_header Connection '';
            proxy_set_header Cache-Control 'no-cache';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_connect_timeout 1s;
            proxy_send_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            # Forward headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for SSE
            proxy_read_timeout 3600s;

        }

        # ── Health check ──
        location /health {
            proxy_pass http://game_engines/health;
            proxy_connect_timeout 1s;
            proxy_send_timeout 1s;
            proxy_read_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
